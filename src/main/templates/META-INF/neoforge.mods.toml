modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/joshua-fonseca/mc-rpg-health-bar/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="itskkura"
displayURL="https://github.com/joshua-fonseca/mc-rpg-health-bar"
# Pixel art, so don't smooth it when it's scaled.
logoFile="rpghealthbar.png"
logoBlur=false
description='''
Replaces the vanilla hearts with an RPG-style health bar, with an optional mana bar for Iron's Spells 'n Spellbooks.
'''
# Client-only mod: servers don't need it, and clients can join servers without it.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

# Optional: when Iron's Spells 'n Spellbooks is installed, a mana bar replaces its own.
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

# Optional: with AppleSkin, saturation is outlined on the hunger bar, and its hunger overlays move with the hunger icons.
[[dependencies.${mod_id}]]
    modId="appleskin"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
